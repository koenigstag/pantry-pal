<?xml version="1.0" encoding="UTF-8"?>
<!--
  The icon for the two platforms that round the corners themselves: Android's
  maskable icon and iOS's apple-touch-icon. The background reaches every edge,
  because both crop it, and the glyph is half the width, so it survives the
  circle Android may cut. Not published: only the PNGs generated from it are.

  public/icon.svg is the same box with the corners rounded in. Regenerate the
  PNGs after changing either one, as apps/frontend/CLAUDE.md describes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#c2410c" />
  <g
    transform="translate(256 256) scale(10.6667) translate(-12 -12)"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path
      d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"
    />
    <path d="M12 22V12" />
    <polyline points="3.29 7 12 12 20.71 7" />
    <path d="m7.5 4.27 9 5.15" />
  </g>
</svg>
