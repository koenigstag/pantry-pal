# Builds the frontend and publishes it to GitHub Pages.
#
# Pages serves static files only, so the site has no backend: the shell renders,
# and pages that need the API show their load error. Before the first run, set
# Settings → Pages → Source to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer run waits instead of cancelling a deployment
# halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before pnpm, so pnpm runs on the pinned Node. No dependency cache: a
      # publishing workflow should not restore state another run could have written.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # No `version`: installs the pnpm named by `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: pnpm install --frozen-lockfile

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Builds shared first (`^build`). base_path is `/<repo>` for a project site
      # and empty for a user site or custom domain; vite.config.ts adds the
      # trailing slash. turbo.json declares BASE_PATH, or strict env mode drops it.
      - name: Build frontend
        run: pnpm exec turbo run build --filter=@pantry-pal/frontend
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # Pages has no SPA rewrites: it answers an unknown path with 404.html. A copy
      # of index.html boots the app on any deep link, and the router takes over.
      - name: Add deep-link fallback
        run: cp apps/frontend/dist/index.html apps/frontend/dist/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
